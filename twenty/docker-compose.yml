x-environment: &default-environment
  - PG_DATABASE_URL=postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD in .env}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
  - SERVER_URL=${SERVER_URL:-http://localhost:3000}
  - REDIS_URL=${REDIS_URL:-redis://redis:6379}
  - STORAGE_TYPE=${STORAGE_TYPE:-local}
  - STORAGE_S3_REGION=${STORAGE_S3_REGION:-}
  - STORAGE_S3_NAME=${STORAGE_S3_NAME:-}
  - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
  - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID:-}
  - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY:-}
  - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env use openssl rand -base64 32}
  - FALLBACK_ENCRYPTION_KEY=${FALLBACK_ENCRYPTION_KEY:-}
  - APP_SECRET=${APP_SECRET:-}
  - NODE_PORT=3000
  - DISABLE_DB_MIGRATIONS=${DISABLE_DB_MIGRATIONS:-false}
  - DISABLE_CRON_JOBS_REGISTRATION=${DISABLE_CRON_JOBS_REGISTRATION:-false}

x-depends_on: &default-depends_on
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  server:
    image: twentycrm/twenty:v2.38.1
    restart: unless-stopped
    volumes:
      - ./data/server:/app/packages/twenty-server/.local-storage
    environment: *default-environment
    depends_on: *default-depends_on
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Keep the worker environment in sync with x-environment above.
  # The worker hardcodes DISABLE_DB_MIGRATIONS and DISABLE_CRON_JOBS_REGISTRATION
  # to true (the server runs them), so it cannot use the shared anchor.
  worker:
    image: twentycrm/twenty:v2.38.1
    restart: unless-stopped
    command: ['yarn', 'worker:prod']
    volumes:
      - ./data/server:/app/packages/twenty-server/.local-storage
    environment:
      - PG_DATABASE_URL=postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD in .env}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      - SERVER_URL=${SERVER_URL:?set SERVER_URL in .env e.g. http://localhost:3000 or https://your-domain}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-}
      - STORAGE_S3_NAME=${STORAGE_S3_NAME:-}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID:-}
      - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env use openssl rand -base64 32}
      - FALLBACK_ENCRYPTION_KEY=${FALLBACK_ENCRYPTION_KEY:-}
      - APP_SECRET=${APP_SECRET:-}
      - DISABLE_DB_MIGRATIONS=true
      - DISABLE_CRON_JOBS_REGISTRATION=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${PG_DATABASE_NAME:-default}
      - POSTGRES_PASSWORD=${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD in .env}
      - POSTGRES_USER=${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['--maxmemory-policy', 'noeviction']
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
