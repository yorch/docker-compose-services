services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    restart: unless-stopped
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      # Server-level settings live in config.d.
      - ./config/clickhouse/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./config/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./config/clickhouse/resource-limits.xml:/etc/clickhouse-server/config.d/resource-limits.xml:ro
      # Profile (user-level) settings are only read from users.d, never config.d.
      - ./config/clickhouse/user-settings.xml:/etc/clickhouse-server/users.d/user-settings.xml:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?password for the ClickHouse user, generate one with openssl rand -hex 16}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8123/ping',
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # Postgres 18 moved its VOLUME to /var/lib/postgresql (PGDATA is now
      # /var/lib/postgresql/18/docker). Mounting the old
      # /var/lib/postgresql/data path here would send the real data to an
      # anonymous volume instead, with no error - see the Notes section of the
      # README.
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-rybbit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?password for the Postgres user, generate one with openssl rand -hex 16}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    # Backs session tracking, sticky identity and bot-anomaly counters.
    # noeviction keeps those keys from being dropped under memory pressure;
    # session keys carry a 30-minute TTL so memory stays bounded by active-user
    # count. AOF (everysec) keeps that state durable across restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?password for Redis, generate one with openssl rand -hex 16}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ghcr.io/rybbit-io/rybbit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-rybbit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?session signing key, generate one with openssl rand -hex 32}
      - BASE_URL=${BASE_URL:?public origin the dashboard is reached on, no trailing slash}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-false}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-4}
      - LITE_DASHBOARD=${LITE_DASHBOARD:-false}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/health',
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    image: ghcr.io/rybbit-io/rybbit-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BASE_URL}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - NEXT_PUBLIC_LITE_DASHBOARD=${LITE_DASHBOARD:-false}
    depends_on:
      backend:
        condition: service_healthy
