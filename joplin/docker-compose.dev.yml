services:
  app:
    ports:
      - ${APP_PORT:-22300}:${APP_PORT:-22300}

  db:
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:5432:5432

  # DB admin UI: dev only, never routed through Traefik (see AGENTS.md).
  # For a production database, SSH-tunnel to this port instead.
  adminer:
    image: adminer:5
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:8080:8080
