services:
  app:
    ports:
      - 8069:8069

  db:
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:5432:5432

  # DB admin UI: dev only, never routed through Traefik (see AGENTS.md).
  # Opt-in: starts only with `--profile adminer`.
  adminer:
    image: adminer:5
    profiles: [adminer]
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:8080:8080
