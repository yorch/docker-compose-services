services:
  app:
    image: supabase/logflare:1.12.5
    restart: unless-stopped
    hostname: 127.0.0.1
    environment:
      - DB_DATABASE=${POSTGRES_DB:-logflare}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_HOSTNAME=db
      - DB_PORT=5432
      - LOGFLARE_SINGLE_TENANT=true
      - LOGFLARE_API_KEY=${LOGFLARE_API_KEY:?generate one with openssl rand -hex 32}
      - PHX_HTTP_PORT=${LOGFLARE_PORT:-4000}

      # Required for BigQuery backend
      # - GOOGLE_DATASET_ID_APPEND=${GOOGLE_DATASET_ID_APPEND}
      # - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      # - GOOGLE_PROJECT_NUMBER=${GOOGLE_PROJECT_NUMBER}
      # ...and uncomment the gcloud.json mount under `volumes` below.

      # Required for Postgres backend
      - POSTGRES_BACKEND_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}@db:5432/${POSTGRES_DB:-logflare}
      - POSTGRES_BACKEND_SCHEMA=${POSTGRES_DB:-logflare}
    # BigQuery backend only: service-account key. Not mounted by default -
    # a bind mount of a missing file stops the container from starting.
    # volumes:
    #   - ./data/gcloud.json:/opt/app/rel/logflare/bin/gcloud.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-logflare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 2s
      retries: 10
