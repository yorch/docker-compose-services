services:
  phoenix:
    image: arizephoenix/phoenix:20
    restart: unless-stopped
    volumes:
      - ./data/phoenix:/data
    environment:
      # Must match the bind mount above. Left at its default (~/.phoenix) the
      # SQLite database is written inside the container instead, with no error -
      # every trace, dataset and experiment is lost on the next recreate.
      - PHOENIX_WORKING_DIR=/data
      # Off by default, matching upstream. With it on, PHOENIX_SECRET becomes
      # mandatory and Phoenix creates admin@localhost on first start.
      - PHOENIX_ENABLE_AUTH=${PHOENIX_ENABLE_AUTH:-false}
      # Secure cookies require HTTPS - turning this on for the dev overlay
      # locks you out of the login form on plain http://localhost.
      - PHOENIX_USE_SECURE_COOKIES=${PHOENIX_USE_SECURE_COOKIES:-false}
      # 0 keeps traces forever.
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-0}
      # Listed without a value on purpose. Phoenix rejects these when they are
      # set but empty - a bare PHOENIX_SECRET= exits with "Phoenix secret must
      # be non-empty" even while auth is off. Written as ${VAR:-} compose would
      # hand the container an empty string every time; with no value it passes
      # them through only when .env actually defines them, which is why they
      # ship commented out in .env.sample.
      - PHOENIX_SECRET
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
      - PHOENIX_CSRF_TRUSTED_ORIGINS
    healthcheck:
      # Exec form using the image's own interpreter. The image ships no shell,
      # curl or wget, so the usual CMD-SHELL test cannot run. python3 rather
      # than python3.13 so a Python bump upstream does not wedge this unhealthy.
      # 127.0.0.1 rather than localhost - localhost resolves to ::1 first and
      # Phoenix listens on IPv4 only, so every probe would burn a refused IPv6
      # connection before falling back. Same reason as the pg_isready -h in
      # openobserve.
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:6006/healthz", timeout=5).status == 200 else 1)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
