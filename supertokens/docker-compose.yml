services:
  app:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRESQL_CONNECTION_URI=postgresql://${POSTGRES_USER:-supertokens}:${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}@db:5432/${POSTGRES_DB:-supertokens}
      # Without it the core accepts any request: anyone who can reach it could
      # create users and mint sessions. Your backend SDK sends it as `api-key`.
      - API_KEYS=${SUPERTOKENS_API_KEY:?generate one with openssl rand -hex 32}
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-supertokens}
      - POSTGRES_USER=${POSTGRES_USER:-supertokens}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
