services:
  registry:
    image: registry:3
    restart: unless-stopped
    volumes:
      - ./data/registry:/var/lib/registry
      - ./data/auth:/auth
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:${REGISTRY_PORT}
      # Basic Authentication
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
      # Enable the deletion of image blobs and manifests by digest (default: false)
      # - REGISTRY_STORAGE_DELETE_ENABLED=true
      # Filesystem storage
      # - REGISTRY_STORAGE=filesystem
      # - REGISRTY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      # - REGISRTY_STORAGE_FILESYSTEM_MAXTHREADS=100
      # - REGISTRY_HEALTH_STORAGEDRIVER_ENABLED=false
      # S3 storage
      - REGISTRY_STORAGE=s3
      - REGISTRY_STORAGE_S3_ACCESSKEY=${REGISTRY_STORAGE_S3_ACCESSKEY}
      - REGISTRY_STORAGE_S3_SECRETKEY=${REGISTRY_STORAGE_S3_SECRETKEY}
      - REGISTRY_STORAGE_S3_BUCKET=${REGISTRY_STORAGE_S3_BUCKET}
      - REGISTRY_STORAGE_S3_REGION=${REGISTRY_STORAGE_S3_REGION}
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      - REGISTRY_HEALTH_STORAGEDRIVER_ENABLED=false
      # LetsEncrypt TLS
      # - REGISTRY_HTTP_TLS_LETSENCRYPT=true
      # - REGISTRY_HTTP_TLS_LETSENCRYPT_CACHEFILE=/var/lib/registry/letsencrypt.cache
      # - REGISTRY_HTTP_TLS_LETSENCRYPT_EMAIL=${REGISTRY_HTTP_TLS_LETSENCRYPT_EMAIL}
      # - REGISTRY_HTTP_TLS_LETSENCRYPT_HOST=${REGISTRY_HTTP_TLS_LETSENCRYPT_HOST}
      # Redis blob descriptor cache. Registry v3 takes the addresses as a list (a plain host:port is a
      # config error), and only uses redis when the cache itself is switched to it.
      - 'REGISTRY_REDIS_ADDRS=["redis:6379"]'
      - REGISTRY_REDIS_DB=0
      - REGISTRY_REDIS_PASSWORD=${REDIS_PASSWORD:?Variable REDIS_PASSWORD not set}
      - REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR=redis
    depends_on:
      redis:
        condition: service_healthy

  # ui:
  #   image: konradkleine/docker-registry-frontend:v2
  #   restart: unless-stopped
  #   environment:
  #     - ENV_DOCKER_REGISTRY_HOST=registry
  #     - ENV_DOCKER_REGISTRY_PORT=${REGISTRY_PORT}
  #   depends_on:
  #     - registry

  ui:
    # https://joxit.dev/docker-registry-ui/
    # image: joxit/docker-registry-ui:main
    # https://yorch.github.io/docker-registry-ui/
    image: ghcr.io/yorch/docker-registry-ui:main
    restart: unless-stopped
    environment:
      - NGINX_PROXY_PASS_URL=http://registry:${REGISTRY_PORT}
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry UI
      - REGISTRY_SECURED=false
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_ELEMENTS_LIMIT=1000
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
    depends_on:
      - registry

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Only a cache: it refills by itself, so nothing is persisted. The plain redis image ignores a
    # REDIS_PASSWORD variable, so the password has to be passed to the server.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Variable REDIS_PASSWORD not set}
      # lets redis-cli (the healthcheck, docker compose exec) log in without the password on a command line
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
