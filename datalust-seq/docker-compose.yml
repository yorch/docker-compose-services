services:
  seq:
    image: datalust/seq:2026.1.17182
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - ACCEPT_EULA=Y
      # Seq 2025.2+ refuses to create a new instance without it. Only read on
      # first run; Seq asks you to change it at the first login.
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD:?set an initial admin password}
