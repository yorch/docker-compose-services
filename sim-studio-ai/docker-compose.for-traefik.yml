services:
  simstudio:
    # Keep `default`: listing only `traefik` drops it, and simstudio then
    # cannot reach db, redis or realtime.
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.simstudio.loadbalancer.server.port=3000'
      # HTTPS Host
      - 'traefik.http.routers.simstudio.rule=Host(`${DOMAIN:?Variable DOMAIN not set}`)'
      - 'traefik.http.routers.simstudio.entrypoints=websecure'
      - 'traefik.http.routers.simstudio.tls=true'
      - 'traefik.http.routers.simstudio.tls.certResolver=webcert'
      - 'traefik.http.routers.simstudio.service=simstudio'

  # The browser opens its socket on the page's own origin under /socket.io,
  # so that path on the same host goes to realtime instead of the app.
  realtime:
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.simstudio-realtime.loadbalancer.server.port=3002'
      # HTTPS Host + path
      - 'traefik.http.routers.simstudio-realtime.rule=Host(`${DOMAIN:?Variable DOMAIN not set}`) && PathPrefix(`/socket.io`)'
      - 'traefik.http.routers.simstudio-realtime.entrypoints=websecure'
      - 'traefik.http.routers.simstudio-realtime.tls=true'
      - 'traefik.http.routers.simstudio-realtime.tls.certResolver=webcert'
      - 'traefik.http.routers.simstudio-realtime.service=simstudio-realtime'

networks:
  traefik:
    external: true
