# simstudio, realtime and migrations share one database schema and must move
# together, so SIM_VERSION drives all of them (plus cron, which has matching tags).
x-database-url: &database-url 'DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}@db:5432/${POSTGRES_DB:-simstudio}'

services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:${SIM_VERSION:-v0.9.3}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    environment:
      - NODE_ENV=production
      - *database-url
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?generate one with openssl rand -hex 32}
      # Cannot be changed later without losing stored credentials
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?generate one with openssl rand -hex 32}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?generate one with openssl rand -hex 32}
      # Authenticates the cron service; without it scheduled workflows never run
      - CRON_SECRET=${CRON_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - FREESTYLE_API_KEY=${FREESTYLE_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  realtime:
    image: ghcr.io/simstudioai/realtime:${SIM_VERSION:-v0.9.3}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      - NODE_ENV=production
      - *database-url
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Must be the public origin, same as simstudio; not an internal URL
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?generate one with openssl rand -hex 32}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?generate one with openssl rand -hex 32}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Realtime refuses to start against a schema older than its image
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/health']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrations:
    image: ghcr.io/simstudioai/migrations:${SIM_VERSION:-v0.9.3}
    working_dir: /app/packages/db
    environment:
      - *database-url
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'

  # Runs scheduled workflows, polling triggers and other background jobs.
  # Exits cleanly (and stays stopped) when CRON_SECRET is unset.
  cron:
    image: ghcr.io/simstudioai/cron:${SIM_VERSION:-v0.9.3}
    restart: on-failure
    environment:
      - SIM_URL=http://simstudio:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - TZ=${TZ:-UTC}
    depends_on:
      simstudio:
        condition: service_healthy

  # Pub/sub for live status streaming; there is no fallback without it
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?generate one with openssl rand -hex 24}
      - POSTGRES_DB=${POSTGRES_DB:-simstudio}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
