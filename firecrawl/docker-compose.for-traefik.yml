services:
  api:
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.firecrawl.loadbalancer.server.port=3002'
      # HTTPS Host
      - 'traefik.http.routers.firecrawl.rule=Host(`${DOMAIN:?Variable DOMAIN not set}`)'
      - 'traefik.http.routers.firecrawl.entrypoints=websecure'
      - 'traefik.http.routers.firecrawl.tls=true'
      - 'traefik.http.routers.firecrawl.tls.certResolver=webcert'
      - 'traefik.http.routers.firecrawl.service=firecrawl'
      # The self-hosted API has no auth and SDKs send their own Authorization
      # header, so basic auth would break them: restrict by source IP instead.
      - 'traefik.http.routers.firecrawl.middlewares=firecrawl-ipallowlist'
      - 'traefik.http.middlewares.firecrawl-ipallowlist.ipallowlist.sourcerange=${FIRECRAWL_ALLOWED_IPS:?comma-separated CIDRs allowed to call the API}'

networks:
  traefik:
    external: true
