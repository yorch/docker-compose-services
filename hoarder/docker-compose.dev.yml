services:
  web:
    ports:
      - 3000:3000

  meilisearch:
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:7700:7700

  # Search admin UI: dev only, never routed through Traefik (see AGENTS.md).
  # Opt-in: starts only with `--profile meilisearch-ui`. Enter
  # http://localhost:7700 and MEILI_MASTER_KEY in the UI to connect.
  meilisearch-ui:
    image: riccoxie/meilisearch-ui:v0.14.1-lite
    profiles: [meilisearch-ui]
    restart: unless-stopped
    ports:
      - ${DEV_BIND_IP:-127.0.0.1}:3001:24900
