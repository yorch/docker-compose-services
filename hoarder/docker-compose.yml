services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-0.33.2}
    restart: unless-stopped
    volumes:
      - ./data/web:/data
    environment:
      - BROWSER_WEB_URL=http://chrome:9222
      - DATA_DIR=/data
      - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-false}
      - MEILI_ADDR=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?generate one with openssl rand -base64 36}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?generate one with openssl rand -base64 36}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - meilisearch
      - chrome

  # Karakeep's own Chrome build (as upstream). gcr.io/zenika-hub/alpine-chrome
  # can no longer be pulled (its registry project has billing disabled).
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?generate one with openssl rand -base64 36}
    volumes:
      - ./data/meilisearch:/meili_data
