# The sandbox service API, runner and sandbox images ship as one release and are
# only supported together, so a single N8N_SANDBOX_VERSION pins all three.
x-common-env: &common-env
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_HOST: db
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_TYPE: postgresdb
  EXECUTIONS_MODE: queue
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_ENABLED: true
  N8N_RUNNERS_MODE: external
  NODE_ENV: ${NODE_ENV}
  QUEUE_BULL_REDIS_HOST: redis
  TZ: ${TZ}

services:
  main:
    image: n8nio/n8n:stable
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/files:/files
    environment:
      <<: *common-env
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      N8N_HOST: ${N8N_HOST}
      # n8n Assistant. The sandbox runs AI-generated code, so it lives behind the
      # opt-in `sandbox` profile (see below) and is off unless that profile is on.
      N8N_ENABLED_MODULES: ${N8N_ENABLED_MODULES:-}
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL:-}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY:-}
      N8N_INSTANCE_AI_SANDBOX_ENABLED: '${N8N_INSTANCE_AI_SANDBOX_ENABLED:-false}'
      N8N_INSTANCE_AI_SANDBOX_API_URL: ${N8N_INSTANCE_AI_SANDBOX_API_URL:-http://sandbox-api:8080}
      N8N_INSTANCE_AI_SANDBOX_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:-}
      N8N_INSTANCE_AI_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.5.0}
      N8N_INSTANCE_AI_SEARXNG_URL: ${N8N_INSTANCE_AI_SEARXNG_URL:-}
      # N8N_NATIVE_PYTHON_RUNNER: true
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: true
      WEBHOOK_URL: ${WEBHOOK_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  worker:
    image: n8nio/n8n:stable
    restart: unless-stopped
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/files:/files
    environment:
      <<: *common-env
      QUEUE_HEALTH_CHECK_ACTIVE: ${QUEUE_HEALTH_CHECK_ACTIVE}
    depends_on:
      - main
    command: worker
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  runners:
    image: n8nio/runners:stable
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://main:5679
    depends_on:
      - main
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 2s
      retries: 10
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: ['redis-server', '--save', '60', '1']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    volumes:
      - ./data/redisinsight:/data
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  auto-update:
    image: nickfedor/watchtower:1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      # - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_LOG_FORMAT=json
      - WATCHTOWER_POLL_INTERVAL=1800
      # - WATCHTOWER_DEBUG=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Monitor and update containers that have a `com.centurylinklabs.watchtower.enable` label set to `true`
      - WATCHTOWER_LABEL_ENABLE=true
      # Update containers that have a `com.centurylinklabs.watchtower.scope` label set with the same value as the given argument. This enables running multiple instances.
      - WATCHTOWER_SCOPE=${WATCHTOWER_SCOPE}
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE}'

  # ---------------------------------------------------------------------------
  # n8n Assistant sandbox (opt-in).
  #
  # These three services run AI-generated code for n8n Assistant. `sandbox-runner-1`
  # is `privileged: true` because it uses Docker-in-Docker to create a throwaway
  # container per execution: treat it as equivalent to root on the host.
  #
  # They are behind the `sandbox` profile, so a plain `up -d` never starts them and
  # no port is ever published - n8n reaches `sandbox-api` by service name over the
  # Compose network. Do not add a `ports:` entry to any of them. Enable with:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
  #     --profile sandbox up -d
  #
  # Watchtower is deliberately not enabled on these: a silent mid-execution update
  # of the runner would kill in-flight sandboxes.
  # ---------------------------------------------------------------------------
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.5.0}
    profiles: [sandbox]
    # Generates the mTLS material the other two need, then exits.
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.5.0}
    profiles: [sandbox]
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    # Only the variables this container needs - the n8n encryption key, database
    # password and model API key must never reach the sandbox.
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?generate one with openssl rand -hex 32}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?generate one with openssl rand -hex 32}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?generate one with openssl rand -hex 32}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.5.0}
    profiles: [sandbox]
    restart: unless-stopped
    # Docker-in-Docker needs full privileges. Keep this off any internet-facing host.
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY:?generate one with openssl rand -hex 32}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?generate one with openssl rand -hex 32}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.5.0}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro

  # Web-search backend for n8n Assistant, reached by service name. The stock image
  # only serves HTML; `searxng-settings.yml` switches on the JSON API n8n needs.
  searxng:
    image: ghcr.io/searxng/searxng:latest
    profiles: [sandbox]
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?generate one with openssl rand -hex 32}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  # Named volume (not a bind mount) because the certs are generated at runtime and
  # only need to persist between the three sandbox services. Never commit them.
  sandbox-tls:
