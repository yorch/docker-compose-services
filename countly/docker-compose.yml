# api and frontend must load the same plugin set
x-countly-plugins: &countly-plugins mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,remote-config,hooks,dashboards,sdk,data-manager

services:
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    volumes:
      # Replaces the image's default site so only Countly is served
      - ./conf/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - countly-api
      - countly-frontend

  countly-api:
    image: countly/api:25.03.54
    restart: unless-stopped
    environment:
      COUNTLY_PLUGINS: *countly-plugins
      COUNTLY_CONFIG__MONGODB_HOST: mongo
      COUNTLY_CONFIG_API_API_WORKERS: ${COUNTLY_API_WORKERS:-2} # CPU core count
      COUNTLY_CONFIG__FILESTORAGE: gridfs
      NODE_OPTIONS: --max-old-space-size=2048
    depends_on:
      - mongo

  countly-frontend:
    image: countly/frontend:25.03.54
    restart: unless-stopped
    environment:
      COUNTLY_PLUGINS: *countly-plugins
      COUNTLY_CONFIG__MONGODB_HOST: mongo
      COUNTLY_CONFIG_HOSTNAME: ${COUNTLY_CONFIG_HOSTNAME:?Variable COUNTLY_CONFIG_HOSTNAME not set}
      NODE_OPTIONS: --max-old-space-size=2048
    depends_on:
      - mongo
    # There is usually no need for more than one frontend, so keep it small
    deploy:
      resources:
        limits:
          cpus: '0.5'

  mongo:
    image: mongo:5-focal
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
