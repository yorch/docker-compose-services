services:
  app:
    # Upstream's registry (multi-arch); v4.3.3 is what `latest` resolves to
    image: ghcr.io/wgdashboard/wgdashboard:v4.3.3
    restart: unless-stopped
    environment:
      - tz=${TZ:-Etc/UTC}
      # Public IP for client configs; detected via ifconfig.me when empty
      - public_ip=${PUBLIC_IP:-}
      - wgd_port=${PORT_WEB:-10086}
      - global_dns=${GLOBAL_DNS:-1.1.1.1}
      # Web account. Without these the image accepts admin/admin, which the
      # Traefik overlay would publish.
      - username=${WGD_USERNAME:-admin}
      - password=${WGD_PASSWORD:?generate one with openssl rand -hex 16}
    ports:
      - 51820:51820/udp
    volumes:
      - ./data/config:/etc/amnezia/amneziawg
      - ./data/etc:/etc/wireguard
      - ./data/data:/data
    cap_add:
      - NET_ADMIN
