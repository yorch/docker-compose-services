services:
  server:
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Woodpecker's SQLite/XDG path. Nothing is written here while
      # WOODPECKER_DATABASE_DRIVER is postgres; kept so switching back to
      # sqlite persists the database.
      - ./data/server:/var/lib/woodpecker
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST}
      # Keep registration closed on a private instance - without this any
      # GitHub user can log in.
      - WOODPECKER_OPEN=${WOODPECKER_OPEN:-false}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      # Forge: GitHub OAuth app with callback ${WOODPECKER_HOST}/authorize
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_DATABASE_DRIVER=postgres
      - WOODPECKER_DATABASE_DATASOURCE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  agent:
    image: woodpeckerci/woodpecker-agent:v3
    command: agent
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./data/agent:/etc/woodpecker
      # Pipelines run as sibling containers on the host daemon. This grants the
      # agent root-equivalent access to the host - see the README.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # gRPC, not HTTP. Stays on the internal network and is never published.
      - WOODPECKER_SERVER=server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # Postgres 18 moved its VOLUME to /var/lib/postgresql (PGDATA is now
      # /var/lib/postgresql/18/docker). Mounting the old /var/lib/postgresql/data
      # path here would send the real data to an anonymous volume instead, with
      # no error - see the Storage section of the README.
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 2s
      retries: 10
