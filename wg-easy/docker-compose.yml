services:
  app:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    container_name: wg-easy
    restart: unless-stopped
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    ports:
      - '51820:51820/udp'
      # - '51821:51821/tcp'
    environment:
      - PORT=51821
      - HOST=0.0.0.0
      # Unattended setup: creates the admin on first start so the setup wizard
      # is never exposed (whoever finished it first would own the VPN). Only
      # read on the first start; see README.
      - INIT_ENABLED=true
      - INIT_USERNAME=${WG_EASY_USERNAME:-admin}
      - INIT_PASSWORD=${WG_EASY_PASSWORD:?generate one with openssl rand -hex 16}
      - INIT_HOST=${WG_HOST:?public hostname or IP clients connect to}
      - INIT_PORT=51820
    volumes:
      - ./data/etc:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
