services:
  app:
    image: lycheeorg/lychee
    restart: unless-stopped
    volumes:
      - ./data/lychee/uploads:/app/public/uploads
      - ./data/lychee/logs:/app/storage/logs
      - ./data/lychee/tmp:/app/storage/tmp
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - APP_KEY=${APP_KEY:?generate one with echo APP_KEY=base64:$(openssl rand -base64 32)}
      - APP_NAME=${APP_NAME:-Lychee}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_TIMEZONE=${TIMEZONE:-UTC}
      - APP_URL=${APP_URL:?set to the public URL e.g. https://lychee.example.com}
      - APP_FORCE_HTTPS=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set the postgres password}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - CACHE_STORE=${CACHE_STORE:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - TRUSTED_PROXIES=*
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set the postgres password}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 2s
      retries: 10
