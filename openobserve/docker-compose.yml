services:
  app:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    volumes:
      - ./data/app:/data
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:?email for the initial admin login}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:?password for the initial admin login}
      # ZO_META_STORE is what actually selects Postgres. Without it OpenObserve
      # defaults to SQLite under ./data/app/db, ignores the DSN below, and
      # leaves the postgres container empty - with no error and a container
      # that reports healthy.
      - ZO_META_STORE=postgres
      # POSTGRES_PASSWORD is interpolated into a URL, so it must be URL-safe.
      # A / or @ in the password truncates the authority and the container dies
      # with Configuration(InvalidPort) - which names the port, not the
      # password. Generate one with openssl rand -hex 32.
      - ZO_META_POSTGRES_DSN=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?set a database password}@postgres:5432/${POSTGRES_DB:?}
      # Where ingested logs, metrics and traces are written. Local disk under
      # ./data/app by default. The ZO_S3_* values below are read only when this
      # is set to s3 - see the README.
      - ZO_LOCAL_MODE_STORAGE=${ZO_LOCAL_MODE_STORAGE:-disk}
      - ZO_S3_PROVIDER=${ZO_S3_PROVIDER:-s3}
      - ZO_S3_SERVER_URL=${ZO_S3_SERVER_URL:-}
      - ZO_S3_REGION_NAME=${ZO_S3_REGION_NAME:-}
      - ZO_S3_BUCKET_NAME=${ZO_S3_BUCKET_NAME:-}
      - ZO_S3_ACCESS_KEY=${ZO_S3_ACCESS_KEY:-}
      - ZO_S3_SECRET_KEY=${ZO_S3_SECRET_KEY:-}
    # No healthcheck - the image is distroless and ships no shell, curl, wget
    # or nc to run one with. Adding one marks the container permanently
    # unhealthy. /healthz is reachable from outside the container.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # Postgres 18 moved its VOLUME to /var/lib/postgresql (PGDATA is now
      # /var/lib/postgresql/18/docker). Mounting the old /var/lib/postgresql/data
      # path here would send the real data to an anonymous volume instead, with
      # no error - see the Storage section of the README.
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a database password}
    healthcheck:
      # -h 127.0.0.1 probes TCP, which is what the app connects over. Without
      # it pg_isready uses the unix socket, which the entrypoint's temporary
      # init server already answers while listen_addresses is still empty - so
      # the check passes and app starts before 5432 accepts connections.
      test: pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
