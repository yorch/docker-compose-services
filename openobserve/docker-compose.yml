services:
  app:
    image: o2cr.ai/openobserve/openobserve-enterprise:latest
    restart: unless-stopped
    volumes:
      - ./data/app:/data
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_META_POSTGRES_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ZO_S3_ACCESS_KEY=${ZO_S3_ACCESS_KEY}
      - ZO_S3_SECRET_KEY=${ZO_S3_SECRET_KEY}
      - ZO_S3_SERVER_URL=${ZO_S3_SERVER_URL}
      - ZO_S3_REGION_NAME=${ZO_S3_REGION_NAME}
      - ZO_S3_BUCKET_NAME=${ZO_S3_BUCKET_NAME}
      - ZO_S3_PROVIDER=${ZO_S3_PROVIDER}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
