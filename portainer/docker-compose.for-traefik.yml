services:
  app:
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.portainer.loadbalancer.server.port=9000'
      # HTTPS Host
      - 'traefik.http.routers.portainer.rule=Host(`${HOST:?Variable HOST not set}`)'
      - 'traefik.http.routers.portainer.entrypoints=websecure'
      - 'traefik.http.routers.portainer.tls=true'
      - 'traefik.http.routers.portainer.tls.certResolver=webcert'
      - 'traefik.http.routers.portainer.service=portainer'
      # Root-equivalent access to the Docker host, and until the first admin is
      # created anyone reaching it can claim it: basic auth is required (see AGENTS.md)
      - 'traefik.http.routers.portainer.middlewares=portainer-auth'
      - 'traefik.http.middlewares.portainer-auth.basicauth.users=${BASIC_AUTH_USER:?Variable BASIC_AUTH_USER not set}:${BASIC_AUTH_PASSWORD_HASH:?generate with htpasswd -nbB, see README}'

networks:
  traefik:
    external: true
