# Two hostnames, because two things have to be reachable from a browser: the
# Langfuse UI, and the MinIO S3 API that serves presigned media URLs. Set
# NEXTAUTH_URL=https://${DOMAIN} and MINIO_PUBLIC_URL=https://${MINIO_DOMAIN}
# in .env to match.
#
# The other four containers get no labels and no traefik network - they are
# only ever reached from inside the compose network.
services:
  web:
    networks:
      # `default` is listed explicitly because naming any network here replaces
      # the implicit one. Dropping it would cut the web app off from postgres,
      # clickhouse, redis and minio.
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.langfuse.loadbalancer.server.port=3000'
      # HTTPS Host
      - 'traefik.http.routers.langfuse.rule=Host(`${DOMAIN:?the public hostname the Langfuse UI answers on}`)'
      - 'traefik.http.routers.langfuse.entrypoints=websecure'
      - 'traefik.http.routers.langfuse.tls=true'
      - 'traefik.http.routers.langfuse.tls.certResolver=webcert'
      - 'traefik.http.routers.langfuse.service=langfuse'

  minio:
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Port 9000 is MinIO's S3 API. The console on 9001 is deliberately not
      # published - it is an admin surface with no place on the public
      # internet, and Langfuse does not use it.
      - 'traefik.http.services.langfuse-minio.loadbalancer.server.port=9000'
      # HTTPS Host
      - 'traefik.http.routers.langfuse-minio.rule=Host(`${MINIO_DOMAIN:?the public hostname MinIO answers on, used for presigned media URLs}`)'
      - 'traefik.http.routers.langfuse-minio.entrypoints=websecure'
      - 'traefik.http.routers.langfuse-minio.tls=true'
      - 'traefik.http.routers.langfuse-minio.tls.certResolver=webcert'
      - 'traefik.http.routers.langfuse-minio.service=langfuse-minio'

networks:
  traefik:
    external: true
