services:
  zot:
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      # Service
      - 'traefik.http.services.zot.loadbalancer.server.port=5000'
      # HTTPS Host
      - 'traefik.http.routers.zot.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.zot.entrypoints=websecure'
      - 'traefik.http.routers.zot.tls=true'
      - 'traefik.http.routers.zot.tls.certResolver=webcert'
      - 'traefik.http.routers.zot.service=zot'

networks:
  traefik:
    external: true
